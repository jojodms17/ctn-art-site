<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration — CTN ART</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Authentification (Netlify Identity) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Panneau d'administration (Decap CMS, ex-Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>

  <!-- Lien persistant vers l'outil d'ajout rapide d'images, au-dessus de
       l'app Decap CMS quelle que soit la vue affichée. -->
  <a href="upload.html" id="quick-upload-link"
     style="position:fixed; bottom:24px; right:24px; z-index:999999;
            display:flex; align-items:center; gap:8px;
            background:#2080F0; color:#fff; font-family:-apple-system,'Plus Jakarta Sans',sans-serif;
            font-weight:700; font-size:14px; text-decoration:none;
            padding:13px 20px; border-radius:999px;
            box-shadow:0 6px 18px rgba(32,128,240,.4);">
    ➕ Ajout rapide d'images
  </a>
</body>
</html>
